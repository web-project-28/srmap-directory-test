<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRMAP Directory Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #18233d 0%, #080c16 45%, #05070d 100%);
      color: #f3f6ff;
    }

    .container {
      width: min(760px, 100%);
      margin: auto;
      padding: 24px 16px 50px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      color: #9ca8c0;
      font-size: 14px;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #293650;
      border-radius: 18px;
      background: rgba(14, 21, 37, 0.92);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #aeb9cf;
      font-size: 13px;
    }

    select,
    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid #34415d;
      background: #090f1d;
      color: white;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6875ff;
      box-shadow: 0 0 0 3px rgba(104, 117, 255, 0.15);
    }

    button {
      margin-top: 13px;
      background: linear-gradient(135deg, #6674ff, #4957dc);
      border-color: #7783ff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: #9eabc4;
      font-size: 13px;
    }

    .error {
      color: #ff9e9e;
    }

    .result-card {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #293650;
      border-radius: 15px;
      background: #0a1120;
    }

    .result-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .result-line {
      margin: 5px 0;
      color: #b9c4d9;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result-line strong {
      color: #e1e7f5;
    }

    .badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #17233b;
      color: #b9c4ff;
      font-size: 11px;
    }

    .read-more {
      display: inline-block;
      margin-top: 8px;
      color: #9da8ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      padding: 25px 10px;
      text-align: center;
      color: #9ba7be;
      font-size: 14px;
    }

    .debug {
      margin-top: 15px;
      max-height: 280px;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: #050914;
      color: #8995ad;
      font: 11px/1.5 monospace;
      white-space: pre-wrap;
    }

    @media (max-width: 560px) {
      .fields {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>SRMAP Directory Test</h1>

    <div class="subtitle">
      Live Student, Faculty and Staff directory search
    </div>

    <section class="card">

      <div class="fields">

        <div>
          <label for="directoryType">
            Directory
          </label>

          <select id="directoryType">
            <option value="student">
              Student Directory
            </option>

            <option value="faculty">
              Faculty Directory
            </option>

            <option value="staff">
              Staff Directory
            </option>
          </select>
        </div>

        <div>
          <label for="searchInput">
            Search
          </label>

          <input
            id="searchInput"
            type="text"
            placeholder="Enter name, ID or email"
            autocomplete="off"
          >
        </div>

      </div>

      <button id="searchButton">
        Search Live Directory
      </button>

      <div id="status" class="status"></div>

    </section>

    <section
      id="results"
      class="card"
      style="display:none;"
    ></section>

  </main>


  <script>

    /*
      IMPORTANT:
      Replace this with your actual Vercel deployment URL.

      Example:
      https://your-project.vercel.app/api/directory
    */

    const API_BASE =
      "https://YOUR-VERCEL-PROJECT.vercel.app/api/directory";


    const directoryType =
      document.getElementById("directoryType");

    const searchInput =
      document.getElementById("searchInput");

    const searchButton =
      document.getElementById("searchButton");

    const status =
      document.getElementById("status");

    const results =
      document.getElementById("results");


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showResults(data) {

      results.style.display = "block";


      if (
        !data.results ||
        data.results.length === 0
      ) {

        results.innerHTML = `
          <div class="empty">
            No matching live records were returned.
          </div>

          ${
            data.debug
              ? `
                <div class="debug">
                  ${escapeHTML(
                    JSON.stringify(
                      data.debug,
                      null,
                      2
                    )
                  )}
                </div>
              `
              : ""
          }
        `;

        return;
      }


      let html = `

        <div class="badge">
          ${escapeHTML(data.directory)}
          •
          ${data.results.length}
          result(s)
        </div>

      `;


      data.results.forEach(person => {

        html += `

          <article class="result-card">

            <div class="result-name">
              ${escapeHTML(
                person.name || "Unknown"
              )}
            </div>

            ${
              person.department
                ? `
                  <div class="result-line">
                    <strong>Department:</strong>
                    ${escapeHTML(
                      person.department
                    )}
                  </div>
                `
                : ""
            }

            ${
              person.email
                ? `
                  <div class="result-line">
                    <strong>Email:</strong>
                    ${escapeHTML(
                      person.email
                    )}
                  </div>
                `
                : ""
            }

            ${
              person.designation
                ? `
                  <div class="result-line">
                    <strong>Designation:</strong>
                    ${escapeHTML(
                      person.designation
                    )}
                  </div>
                `
                : ""
            }

            ${
              person.phone
                ? `
                  <div class="result-line">
                    <strong>Phone:</strong>
                    ${escapeHTML(
                      person.phone
                    )}
                  </div>
                `
                : ""
            }

            ${
              person.profileUrl
                ? `
                  <a
                    class="read-more"
                    href="${escapeHTML(
                      person.profileUrl
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Read More →
                  </a>
                `
                : ""
            }

          </article>

        `;

      });


      if (data.debug) {

        html += `

          <div class="debug">
            ${escapeHTML(
              JSON.stringify(
                data.debug,
                null,
                2
              )
            )}
          </div>

        `;

      }


      results.innerHTML = html;

    }


    async function searchDirectory() {

      const query =
        searchInput.value.trim();


      if (query.length < 2) {

        status.innerHTML =
          '<span class="error">Enter at least 2 characters.</span>';

        searchInput.focus();

        return;

      }


      searchButton.disabled = true;

      results.style.display = "none";

      status.textContent =
        "Searching the live SRM Intranet...";


      try {

        const url =
          new URL(API_BASE);


        url.searchParams.set(
          "type",
          directoryType.value
        );


        url.searchParams.set(
          "q",
          query
        );


        const response =
          await fetch(url.toString());


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        status.textContent =
          `Live search completed • ${
            data.results?.length || 0
          } result(s)`;


        showResults(data);

      }

      catch (error) {

        status.innerHTML = `

          <span class="error">
            ${escapeHTML(error.message)}
          </span>

        `;


        results.style.display = "block";

        results.innerHTML = `

          <div class="empty error">
            Backend/search request failed.
          </div>

        `;

      }

      finally {

        searchButton.disabled = false;

      }

    }


    searchButton.addEventListener(
      "click",
      searchDirectory
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          searchDirectory();
        }

      }
    );

  </script>

</body>
</html>
