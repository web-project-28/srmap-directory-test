<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRMAP Directory</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: #f4f5f7;
    }

    .app {
      width: min(760px, 100%);
      margin: auto;
      padding: 18px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .sub {
      color: #9da4b3;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .panel {
      background: #111722;
      border: 1px solid #252d3a;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #aeb6c5;
      font-size: 13px;
    }

    select,
    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid #30394a;
      background: #0b1019;
      color: white;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      background: #c9952e;
      color: #111;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      color: #aeb6c5;
      font-size: 14px;
      margin-top: 8px;
    }

    .error {
      color: #ff7777;
    }

    .result {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #28303c;
    }

    .result:last-child {
      border-bottom: none;
    }

    .photo {
      width: 105px;
      height: 125px;
      flex: 0 0 105px;
      object-fit: cover;
      background: #d1d1d1;
      border-radius: 7px;
    }

    .info {
      min-width: 0;
    }

    .name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .field {
      margin: 5px 0;
      line-height: 1.35;
      color: #c6ccd7;
    }

    .field strong {
      color: white;
    }

    .read {
      display: inline-block;
      margin-top: 10px;
      color: #e3b34c;
      font-weight: 700;
      text-decoration: none;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: #aeb6c5;
    }

    @media (max-width: 520px) {
      .result {
        gap: 10px;
      }

      .photo {
        width: 90px;
        height: 110px;
        flex-basis: 90px;
      }

      .name {
        font-size: 15px;
      }

      .field {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>SRMAP Directory</h1>
  <div class="sub">
    Search live Student, Faculty and Staff records from SRM University-AP.
  </div>

  <div class="panel">

    <label for="directoryType">Directory</label>

    <select id="directoryType">
      <option value="student">Student Directory</option>
      <option value="faculty">Faculty Directory</option>
      <option value="staff">Staff Directory</option>
    </select>

    <label for="department">Department</label>

    <select id="department">
      <option value="">Loading departments...</option>
    </select>

    <label for="search">Name</label>

    <input
      id="search"
      type="text"
      placeholder="Enter name"
      autocomplete="off"
    >

    <button id="searchBtn">
      Search Live Directory
    </button>

    <div id="status" class="status"></div>

  </div>

  <div id="results" class="panel">
    <div class="empty">
      Select a department and search for a person.
    </div>
  </div>

</div>

<script>
  const API_BASE =
    "https://YOUR-VERCEL-PROJECT.vercel.app/api/directory";

  const directoryType = document.getElementById("directoryType");
  const department = document.getElementById("department");
  const search = document.getElementById("search");
  const searchBtn = document.getElementById("searchBtn");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");

  async function loadDepartments() {
    department.innerHTML =
      '<option value="">Loading departments...</option>';

    statusBox.textContent = "Loading live departments...";

    try {
      const res = await fetch(
        `${API_BASE}?action=departments&type=${encodeURIComponent(directoryType.value)}`
      );

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      department.innerHTML =
        '<option value="">Select Department</option>';

      for (const item of data.departments || []) {
        const option = document.createElement("option");

        option.value = item.value;
        option.textContent = item.label;

        department.appendChild(option);
      }

      statusBox.textContent =
        `${data.departments?.length || 0} live departments loaded.`;

    } catch (err) {

      department.innerHTML =
        '<option value="">Unable to load departments</option>';

      statusBox.innerHTML =
        `<span class="error">Failed to fetch: ${escapeHtml(err.message)}</span>`;
    }
  }

  async function searchDirectory() {

    const type = directoryType.value;
    const dept = department.value;
    const q = search.value.trim();

    if (!dept) {
      statusBox.innerHTML =
        '<span class="error">Select a department first.</span>';
      return;
    }

    if (!q) {
      statusBox.innerHTML =
        '<span class="error">Enter a name to search.</span>';
      return;
    }

    searchBtn.disabled = true;
    searchBtn.textContent = "Searching...";
    resultsBox.innerHTML =
      '<div class="empty">Searching SRM Intranet...</div>';
    statusBox.textContent = "";

    try {

      const url =
        `${API_BASE}?action=search` +
        `&type=${encodeURIComponent(type)}` +
        `&department=${encodeURIComponent(dept)}` +
        `&q=${encodeURIComponent(q)}`;

      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      renderResults(data.results || []);

      statusBox.textContent =
        `${data.results?.length || 0} result(s) found.`;

    } catch (err) {

      resultsBox.innerHTML =
        `<div class="empty error">
          Failed to fetch<br><br>
          ${escapeHtml(err.message)}
        </div>`;

      statusBox.textContent = "";
    }

    searchBtn.disabled = false;
    searchBtn.textContent = "Search Live Directory";
  }

  function renderResults(items) {

    if (!items.length) {
      resultsBox.innerHTML =
        '<div class="empty">No matching records found.</div>';
      return;
    }

    resultsBox.innerHTML = "";

    for (const person of items) {

      const row = document.createElement("div");
      row.className = "result";

      const photo = document.createElement("img");
      photo.className = "photo";
      photo.src = person.photo || "";
      photo.alt = person.name || "Profile photo";

      photo.onerror = () => {
        photo.style.display = "none";
      };

      const info = document.createElement("div");
      info.className = "info";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = person.name || "Unknown";

      info.appendChild(name);

      addField(info, "Department", person.department);
      addField(info, "Branch", person.branch);
      addField(info, "Designation", person.designation);
      addField(info, "Email", person.email);
      addField(info, "Phone", person.phone);

      if (person.profileUrl) {
        const link = document.createElement("a");

        link.className = "read";
        link.href = person.profileUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Read More";

        info.appendChild(link);
      }

      row.appendChild(photo);
      row.appendChild(info);

      resultsBox.appendChild(row);
    }
  }

  function addField(parent, label, value) {

    if (!value) return;

    const div = document.createElement("div");
    div.className = "field";

    const strong = document.createElement("strong");
    strong.textContent = label + ": ";

    div.appendChild(strong);
    div.appendChild(document.createTextNode(value));

    parent.appendChild(div);
  }

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  directoryType.addEventListener("change", loadDepartments);
  searchBtn.addEventListener("click", searchDirectory);

  search.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      searchDirectory();
    }
  });

  loadDepartments();
</script>

</body>
</html>
